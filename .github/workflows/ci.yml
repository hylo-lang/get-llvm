name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  unit-tests:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm ci
        shell: bash

      - run: npx vitest run
        shell: bash


  check-dist:
    name: Check dist/ is up-to-date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run pack
      - name: Verify dist/ has no uncommitted changes
        run: |
          if ! git diff --exit-code -- dist; then
            echo "::error::dist/ is out of date. Run 'npm run pack' and commit the result."
            exit 1
          fi

  integration-test:
    name: Integration test (${{ matrix.os }})
    needs: 
      - unit-tests
      - check-dist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
      - id: get-llvm
        uses: ./
        with:
          llvmVersion: '20.1.6'
          llvmBuildRelease: '20260522-192015'

      - name: Run 'llvm-config --version'
        run: llvm-config --version
        shell: bash
      - name: Verify llvmRootDirectory output is set
        shell: bash
        run: |
          if [ -z "${{ steps.get-llvm.outputs.llvmRootDirectory }}" ]; then
            echo "::error::llvmRootDirectory output is empty"
            exit 1
          fi
          echo "LLVM root: ${{ steps.get-llvm.outputs.llvmRootDirectory }}"
